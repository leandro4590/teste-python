name: GitHub Actions - Gerenciamento erros
run-name: Running - Gerenciamento erros
on: [push, workflow_dispatch]

jobs:
  job_1_erro:
    runs-on: ubuntu-latest
    steps:
    - name: Comentário
      run: |
        echo Comentario antes do erro
        exit 1
    - name: Comentário
      run: |
        echo Comentario apos o erro

  job_2_always:
    runs-on: ubuntu-latest
    steps:
    - name: Comentário
      run: |
        echo Comentario antes do erro
        exit 1
    - name: Comentário
      if: always()
      run: |
        echo Comentario apos o erro

  job_3_continue_on_error:
    runs-on: ubuntu-latest
    steps:
    - name: Comentário
      run: |
        echo Comentario antes do erro
        exit 1
      continue-on-error: true
    - name: Comentário
      run: |
        echo Comentario apos o erro